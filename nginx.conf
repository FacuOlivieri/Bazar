server {
    listen 80;
    root /usr/share/nginx/html;

    # Sin barra final en proxy_pass: el back recibe /api/... y /auth/... tal cual
    location /api/  { proxy_pass http://backend:8080; }
    location /auth/ { proxy_pass http://backend:8080; }

    # Rutas del front (/login, /usuarios...): siempre index.html y React Router decide
    location / { try_files $uri $uri/ /index.html; }
}
