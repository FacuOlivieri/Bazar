# ============================================================
# Configuracion MySQL (phpMyAdmin / XAMPP)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Configuracion JWT
# ============================================================
security.jwt.private.key=${PRIVATE_SEC_KEY}
security.jwt.user.generator=${USER_SEC}

# ============================================================
# Usuario admin inicial (lo crea DataSeeder si no hay usuarios)
# ============================================================
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin}
