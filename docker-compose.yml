# Levanta todo: docker compose up -d --build
# Navegador -> :80 frontend (nginx) -> /api y /auth -> backend:8080 -> db:3306
# OJO: las contraseñas estan en el repo publico; en el servidor real usar otras

services:

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bazarv1
      MYSQL_USER: bazar
      MYSQL_PASSWORD: b5e56bb7b34837508eb478fd
      MYSQL_ROOT_PASSWORD: 5be13047293ce9478d981341
    # Los datos se guardan en un volumen: sobreviven aunque se borre el contenedor
    volumes:
      - db_data:/var/lib/mysql
    # El back espera a que MySQL responda antes de arrancar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./BazarV1
    environment:
      DB_URL: jdbc:mysql://db:3306/bazarv1?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: bazar
      DB_PASSWORD: b5e56bb7b34837508eb478fd
      PRIVATE_SEC_KEY: 832b19a2a019d22e2f0348611fe8ed3d632636cdceabe448850b9ad1d1e19de6
      USER_SEC: BAZAR-SEC
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./front
    # Unico puerto publicado: db y backend solo se ven dentro de la red de Docker
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
